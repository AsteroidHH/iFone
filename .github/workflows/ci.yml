name: ci

on:
  push:
    branches: [main, hamza/frontend]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt ruff pytest-cov hypothesis
      - name: Lint
        run: ruff check backend bench scripts mcp tests
      - name: Tests with coverage (FalkorDB is a service container)
        run: python -m pytest -q --cov=backend/app --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Retrieval benchmark (offline)
        run: python bench/retrieval_bench.py && git diff --exit-code bench/retrieval_bench.json || echo "benchmark numbers changed: review bench/retrieval_bench.json"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Types, lint, unit tests, contrast, contract, both builds
        run: npm run verify
      - name: Browser QA on the sample build (including axe accessibility)
        run: |
          npx playwright-core install chromium --with-deps
          npm run preview:mock &
          sleep 5
          QUORUM_BROWSER=chromium node scripts/interact.mjs http://127.0.0.1:5173/
          QUORUM_BROWSER=chromium node scripts/a11y.mjs http://127.0.0.1:5173/

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        run: docker compose up -d --build
      - name: Wait for the hub and run the doctor
        run: |
          for i in $(seq 1 40); do curl -sf localhost:8000/api/health && break; sleep 3; done
          pip install -r backend/requirements.txt
          python scripts/doctor.py
      - name: Live QA against the stack
        run: |
          cd frontend && npm ci --legacy-peer-deps && npx playwright-core install chromium --with-deps
          QUORUM_BROWSER=chromium node scripts/live.mjs http://127.0.0.1:5173 http://127.0.0.1:8000

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory: new advisories should be read, not block a merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - run: cd frontend && npm audit --omit=dev --audit-level=high
