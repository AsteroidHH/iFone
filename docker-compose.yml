version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: quorum-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
      - ./scripts/users.acl:/etc/redis/users.acl:ro
    restart: unless-stopped
    command: ["--loadmodule", "/usr/lib/redis/modules/falkordb.so"]

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    ports:
      - "8080:8080"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      - falkordb
    restart: unless-stopped

  mock-helpdesk:
    build:
      context: ./mock_helpdesk
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - HELPDESK_URL=http://mock-helpdesk:8002
      - MCP_SERVER_URL=http://mcp-server:8001
      - QUORUM_MODE=replay
    depends_on:
      - falkordb
      - mock-helpdesk
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quorum-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
