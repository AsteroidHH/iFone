version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    command: ["--loadmodule", "/usr/lib/redis/modules/falkordb.so"] 

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    ports:
      - "8080:8080"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      - falkordb

  # The following are placeholders for the Oct 15 build
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://falkordb:6379
    depends_on:
      - falkordb
    profiles:
      - do-not-start-yet

  mcp_server:
    build: ./mcp
    ports:
      - "8001:8001"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    profiles:
      - do-not-start-yet

  agents:
    build: ./agents
    environment:
      - MCP_SERVER_URL=http://mcp_server:8001
    depends_on:
      - mcp_server
    profiles:
      - do-not-start-yet

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles:
      - do-not-start-yet

volumes:
  falkordb_data:
